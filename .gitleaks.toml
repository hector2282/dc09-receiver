# Default gitleaks rules, plus a narrow allowlist for things that are NOT secrets:
# - the obviously fake AES keys used in tests and examples (00..0F, 00..FF)
# - environment variable NAMES such as DC09_KEY_5678 referenced by key_env/secret_env
[extend]
useDefault = true

[allowlist]
description = "fictitious test keys and env var names"
regexes = [
  '''000102030405060708090A0B0C0D0E0F''',
  '''00112233445566778899AABBCCDDEEFF''',
  '''^DC09_[A-Z0-9_]+$''',
]
